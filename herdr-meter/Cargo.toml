[package]
name = "hmeter"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Collect and show coding-agent cache and usage state for herdr"

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
